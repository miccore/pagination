name: Release & Publish to NuGet

on:
  push:
    tags:
      - 'v*.*.*'

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NUGET_DIRECTORY: ${{ github.workspace }}/nuget

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Extract version from tag
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore -p:Version=${{ steps.get_version.outputs.VERSION }}

    - name: Run tests
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: Pack NuGet package
      run: |
        dotnet pack src/Miccore.Pagination.csproj \
          --configuration Release \
          --no-build \
          --output ${{ env.NUGET_DIRECTORY }} \
          -p:PackageVersion=${{ steps.get_version.outputs.VERSION }}

    - name: Upload NuGet package artifact
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: ${{ env.NUGET_DIRECTORY }}/*.nupkg
        if-no-files-found: error

    - name: Upload Symbol package artifact
      uses: actions/upload-artifact@v4
      with:
        name: symbol-package
        path: ${{ env.NUGET_DIRECTORY }}/*.snupkg
        if-no-files-found: warn

  publish-nuget:
    runs-on: ubuntu-latest
    needs: build
    environment: nuget-publish
    
    steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Download NuGet package
      uses: actions/download-artifact@v4
      with:
        name: nuget-package
        path: ${{ env.NUGET_DIRECTORY }}

    - name: Download Symbol package
      uses: actions/download-artifact@v4
      with:
        name: symbol-package
        path: ${{ env.NUGET_DIRECTORY }}
      continue-on-error: true

    - name: Publish to NuGet.org
      run: |
        dotnet nuget push ${{ env.NUGET_DIRECTORY }}/*.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate

  create-release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download NuGet package
      uses: actions/download-artifact@v4
      with:
        name: nuget-package
        path: ./packages

    - name: Download Symbol package
      uses: actions/download-artifact@v4
      with:
        name: symbol-package
        path: ./packages
      continue-on-error: true

    - name: Extract version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: Release v${{ steps.get_version.outputs.VERSION }}
        tag_name: ${{ github.ref_name }}
        draft: false
        prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
        generate_release_notes: true
        files: |
          ./packages/*.nupkg
          ./packages/*.snupkg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
